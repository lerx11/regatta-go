<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клуб — выходы и экипажи</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛵</text></svg>">
<style>
:root{
  --ink:#04101c; --sea:#0b2b41; --teal:#35d1c4; --cyan:#7ae7ff; --sand:#f0d9a8; --red:#ff5d6c;
  --text:#eaf4fb; --muted:#85a4bb; --line:rgba(122,231,255,.14);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --radius:16px;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100svh;background:var(--ink);color:var(--text);
  font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(120% 60% at 10% 0%,rgba(53,209,196,.12),transparent 60%),
    radial-gradient(80% 60% at 90% 10%,rgba(122,231,255,.08),transparent 60%);
}
header{border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;background:rgba(4,16,28,.85);backdrop-filter:blur(12px)}
.wrap{width:min(1120px,100%);margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;flex-wrap:wrap}
.head h1{margin:0;font-size:19px;letter-spacing:-.01em}
.head .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:2px}
.head-actions{display:flex;align-items:center;gap:14px;font-size:13px}
.head-actions a,.head-actions button{
  color:var(--muted);background:none;border:0;font:inherit;cursor:pointer;text-decoration:none;padding:0;
}
.head-actions a:hover,.head-actions button:hover{color:var(--cyan)}
.head-actions .btn{padding:8px 14px}
.head-actions .btn.primary{border:0;color:#04191c}
.head-actions .btn.primary:hover{color:#04191c;filter:brightness(1.07)}
main{padding-block:clamp(20px,4vw,36px) 60px}
.status{margin-bottom:18px;font-size:13.5px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--red)}
.weeks{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media(max-width:860px){.weeks{grid-template-columns:1fr}}
.week h2{
  font-size:14px;margin:0 0 10px;font-family:var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.list{display:flex;flex-direction:column;gap:8px}
.trip{
  display:block;width:100%;text-align:left;padding:14px 16px;border-radius:var(--radius);
  border:1px solid var(--line);background:rgba(11,43,65,.38);color:inherit;font:inherit;
  cursor:pointer;transition:border-color .2s,background .2s;
}
.trip:hover{border-color:rgba(122,231,255,.34);background:rgba(11,43,65,.6)}
.trip.active{border-color:rgba(122,231,255,.6);box-shadow:inset 0 0 0 1px rgba(122,231,255,.25)}
.trip-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.trip-title{font-weight:600;font-size:15.5px}
.trip-when{font-family:var(--mono);font-size:11.5px;color:var(--teal);white-space:nowrap}
.trip-meta{margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.trip-meta b{color:var(--text);font-weight:560}
.badge{
  display:inline-block;margin-left:8px;padding:2px 8px;border-radius:99px;font-family:var(--mono);
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;vertical-align:middle;
  border:1px solid rgba(255,141,94,.4);color:#ffb28c;
}
.badge.live{border-color:rgba(53,209,196,.45);color:var(--teal)}
.badge.finished{border-color:rgba(133,164,187,.35);color:var(--muted)}
.badge.closed{border-color:rgba(255,93,108,.45);color:#ff9aa4}
.badge.cancelled{border-color:rgba(255,93,108,.5);color:#ff9aa4}
.trip.cancelled{opacity:.68}
.trip-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{
  cursor:pointer;border-radius:10px;border:1px solid var(--line);background:rgba(11,43,65,.6);
  color:var(--text);font:inherit;font-size:13px;padding:8px 14px;white-space:nowrap;
  transition:border-color .2s,background .2s,filter .2s;
}
.btn:hover{border-color:rgba(122,231,255,.4)}
.btn.primary{background:linear-gradient(135deg,var(--teal),#22a79c);border:0;color:#04191c;font-weight:650}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:#ff9aa4;border-color:rgba(255,93,108,.4)}
.btn.small{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.editor{
  margin-bottom:22px;padding:clamp(16px,3vw,24px);border:1px solid var(--line);
  border-radius:var(--radius);background:rgba(6,26,43,.55);
}
.editor[hidden]{display:none}
.editor h2{margin:0 0 14px;font-size:17px}
.editor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field label{
  display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px;
}
.field input,.field select{
  width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);
  background:rgba(4,16,28,.6);color:var(--text);font:inherit;font-size:14px;outline:none;
}
.field input:focus,.field select:focus{border-color:rgba(122,231,255,.5)}
.field input:disabled,.field select:disabled{opacity:.55}
.editor-note{min-height:1.2em;margin-top:12px;font-size:13px;color:var(--muted)}
.editor-note.err{color:var(--red)}
.editor-actions{display:flex;gap:10px;flex-wrap:wrap}
.detail{
  margin-top:22px;padding:clamp(18px,3vw,26px);border:1px solid var(--line);
  border-radius:var(--radius);background:rgba(6,26,43,.5);
}
.detail[hidden]{display:none}
.detail h3{margin:0 0 4px;font-size:21px}
.detail .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.detail .sub b{color:var(--text);font-weight:600}
.crew-list{display:flex;flex-direction:column;gap:8px}
.crew{
  display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:11px 14px;border-radius:12px;
  border:1px solid var(--line);background:rgba(4,16,28,.45);font-size:14px;
}
.crew .contact{font-family:var(--mono);font-size:12.5px;color:var(--cyan)}
.crew .at{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;padding:12px 0}
</style>
</head>
<body>
<header>
  <div class="wrap head">
    <div>
      <span class="eyebrow">Закрытый раздел</span>
      <h1>Выходы и экипажи</h1>
    </div>
    <div class="head-actions">
      <button type="button" id="addTrip" class="btn primary">Добавить выход</button>
      <a href="/">На сайт</a>
      <button type="button" id="logout">Выйти</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="status" id="status">Загружаем выходы…</div>

  <section class="editor" id="editor" hidden>
    <h2 id="editorTitle">Новый выход</h2>
    <div class="editor-grid">
      <div class="field">
        <label for="fSpot">Акватория</label>
        <select id="fSpot"></select>
      </div>
      <div class="field">
        <label for="fBoat">Лодка</label>
        <input id="fBoat" maxlength="60" placeholder="Лазер 4.7" autocomplete="off">
      </div>
      <div class="field">
        <label for="fDate">Дата</label>
        <input id="fDate" type="date">
      </div>
      <div class="field">
        <label for="fStart">Начало (МСК)</label>
        <input id="fStart" type="time" value="10:00">
      </div>
      <div class="field">
        <label for="fEnd">Окончание (МСК)</label>
        <input id="fEnd" type="time" value="12:00">
      </div>
      <div class="field">
        <label for="fCapacity">Мест</label>
        <input id="fCapacity" type="number" min="1" max="50" value="4">
      </div>
    </div>
    <div class="editor-note" id="editorNote"></div>
    <div class="editor-actions">
      <button type="button" class="btn primary" id="editorSubmit">Создать выход</button>
      <button type="button" class="btn" id="editorClose">Отмена</button>
    </div>
  </section>

  <div class="weeks">
    <section class="week">
      <h2>Эта неделя</h2>
      <div class="list" id="current"></div>
    </section>
    <section class="week">
      <h2>Следующая неделя</h2>
      <div class="list" id="next"></div>
    </section>
  </div>

  <section class="detail" id="detail" hidden>
    <h3 id="detailTitle"></h3>
    <p class="sub" id="detailSub"></p>
    <div class="crew-list" id="crewList"></div>
  </section>
</main>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const MSK_TIME = new Intl.DateTimeFormat("ru-RU", {
  timeZone:"Europe/Moscow", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23"
});

async function api(url, opts){
  const res = await fetch(url, Object.assign({ headers:{ accept:"application/json" } }, opts || {}));
  if(res.status === 401){ window.location.href = "/club"; throw new Error("нужен пароль"); }
  const data = await res.json().catch(() => null);
  if(!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
  return data;
}

function mutate(url, method, body){
  return api(url, {
    method,
    headers:{ accept:"application/json", "content-type":"application/json" },
    body: JSON.stringify(body || {})
  });
}

const statusLabels = { live:"Идёт", finished:"Завершён", closed:"Запись закрыта", cancelled:"Отменён" };
const ESC = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
function esc(v){ return String(v == null ? "" : v).replace(/[&<>"']/g, c => ESC[c]); }

let editingId = null;
let spotsLoaded = false;

// Будущий выход можно перенести или отменить; отменённые и начавшиеся — нет.
function canEdit(t){ return !t.started && t.status !== "cancelled"; }

function timeRange(t){ return t.end ? t.time + "–" + t.end : t.time; }

function todayMSK(){
  return new Intl.DateTimeFormat("en-CA", {
    timeZone:"Europe/Moscow", year:"numeric", month:"2-digit", day:"2-digit"
  }).format(new Date());
}

function setEditorNote(msg, isErr){
  const note = $("#editorNote");
  note.className = isErr ? "editor-note err" : "editor-note";
  note.textContent = msg;
}

async function ensureSpots(){
  if(spotsLoaded) return;
  const data = await api("/api/spots");
  const sel = $("#fSpot");
  sel.innerHTML = "";
  (data.spots || []).forEach(sp => {
    const opt = document.createElement("option");
    opt.value = sp.slug;
    opt.textContent = sp.name;
    sel.appendChild(opt);
  });
  spotsLoaded = true;
}

function openEditor(trip){
  editingId = trip ? trip.id : null;
  $("#editor").hidden = false;
  $("#editorTitle").textContent = trip ? "Изменить выход" : "Новый выход";
  $("#editorSubmit").textContent = trip ? "Сохранить изменения" : "Создать выход";
  setEditorNote("", false);
  $("#fBoat").value = trip ? trip.boat : "";
  $("#fDate").value = trip ? trip.date : todayMSK();
  $("#fDate").min = todayMSK();
  $("#fStart").value = trip ? trip.time : "10:00";
  $("#fEnd").value = trip ? (trip.end || "") : "12:00";
  $("#fCapacity").value = trip ? trip.capacity : 4;
  $("#fCapacity").min = trip ? Math.max(1, trip.booked) : 1;
  ["#fSpot", "#fBoat", "#fDate"].forEach(sel => { $(sel).disabled = !!trip; });
  ensureSpots().then(() => {
    if(trip) $("#fSpot").value = trip.spot;
  }).catch(err => setEditorNote("Не удалось загрузить акватории: " + err.message, true));
  $("#editor").scrollIntoView({ behavior:"smooth", block:"start" });
  $("#fStart").focus();
}

function closeEditor(){
  $("#editor").hidden = true;
  editingId = null;
}

function tripButton(t){
  const el = document.createElement("div");
  el.className = "trip" + (t.status === "cancelled" ? " cancelled" : "");
  el.dataset.id = t.id;
  el.tabIndex = 0;
  el.setAttribute("role", "button");
  const badge = statusLabels[t.status]
    ? '<span class="badge ' + t.status + '">' + statusLabels[t.status] + "</span>"
    : "";
  el.innerHTML =
    '<div class="trip-top"><span class="trip-title"></span><span class="trip-when"></span></div>' +
    '<div class="trip-meta"><span>Заявок: <b class="n"></b></span><span class="boat"></span></div>';
  el.querySelector(".trip-title").textContent = t.spot_name;
  el.querySelector(".trip-title").insertAdjacentHTML("beforeend", badge);
  el.querySelector(".trip-when").textContent = t.label + " · " + timeRange(t) + " МСК";
  el.querySelector(".n").textContent = t.booked + " / " + t.capacity;
  el.querySelector(".boat").textContent = t.boat;

  if(canEdit(t)){
    const actions = document.createElement("div");
    actions.className = "trip-actions";
    const edit = document.createElement("button");
    edit.type = "button";
    edit.className = "btn small";
    edit.textContent = "Изменить";
    edit.addEventListener("click", (e) => { e.stopPropagation(); openEditor(t); });
    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "btn small danger";
    cancel.textContent = "Отменить выход";
    cancel.addEventListener("click", (e) => { e.stopPropagation(); cancelTrip(t); });
    actions.appendChild(edit);
    actions.appendChild(cancel);
    el.appendChild(actions);
  }

  const open = () => openTrip(t.id);
  el.addEventListener("click", open);
  el.addEventListener("keydown", (e) => {
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); open(); }
  });
  return el;
}

function renderList(node, trips){
  node.innerHTML = "";
  if(!trips.length){
    node.innerHTML = '<div class="empty">Выходов нет.</div>';
    return;
  }
  trips.forEach(t => node.appendChild(tripButton(t)));
}

async function load(){
  const status = $("#status");
  status.className = "status";
  status.textContent = "Загружаем выходы…";
  try{
    const data = await api("/api/club/trips");
    renderList($("#current"), data.current || []);
    renderList($("#next"), data.next || []);
    status.textContent = "";
  }catch(err){
    status.className = "status err";
    status.textContent = "Не удалось загрузить выходы: " + err.message;
  }
}

async function openTrip(id){
  const status = $("#status");
  document.querySelectorAll(".trip").forEach(el => el.classList.toggle("active", el.dataset.id === id));
  try{
    const t = await api("/api/club/trips/" + encodeURIComponent(id));
    $("#detail").hidden = false;
    $("#detailTitle").textContent = t.spot_name;
    const detailBadge = statusLabels[t.status]
      ? ' <span class="badge ' + t.status + '">' + statusLabels[t.status] + "</span>" : "";
    $("#detailSub").innerHTML =
      "Дата: <b>" + esc(t.label) + "</b> · Время: <b>" + esc(timeRange(t)) + " МСК</b> · " +
      "Лодка: <b>" + esc(t.boat) + "</b> · Заявок: <b>" + t.booked + " из " + t.capacity + "</b>" +
      (t.status === "cancelled" ? ' · <b style="color:#ff9aa4">Отменён</b>' : "");
    $("#detailTitle").insertAdjacentHTML("beforeend", detailBadge);
    const list = $("#crewList");
    list.innerHTML = "";
    if(!t.crew || !t.crew.length){
      list.innerHTML = '<div class="empty">Заявок пока нет.</div>';
      return;
    }
    t.crew.forEach(m => {
      const row = document.createElement("div");
      row.className = "crew";
      const at = m.at ? MSK_TIME.format(new Date(m.at)) + " МСК" : "";
      row.innerHTML = '<span class="name"></span><span class="contact"></span><span class="at"></span>';
      row.querySelector(".name").textContent = m.name;
      row.querySelector(".contact").textContent = m.contact;
      row.querySelector(".at").textContent = at;
      list.appendChild(row);
    });
  }catch(err){
    status.className = "status err";
    status.textContent = "Не удалось открыть экипаж: " + err.message;
  }
}

async function cancelTrip(t){
  const text = "Отменить выход " + t.spot_name + " " + t.label + " в " + t.time + "?\n\n" +
    "Заявок: " + t.booked + ". Запись закроется, карточка и участники останутся в кабинете.";
  if(!window.confirm(text)) return;

  const status = $("#status");
  status.className = "status";
  status.textContent = "Отменяем выход…";
  try{
    await mutate("/api/club/trips/" + encodeURIComponent(t.id) + "/cancel", "POST", {});
    await load();
    await openTrip(t.id);
  }catch(err){
    status.className = "status err";
    status.textContent = "Не удалось отменить выход: " + err.message;
  }
}

$("#editorSubmit").addEventListener("click", async () => {
  const btn = $("#editorSubmit");
  const start = $("#fStart").value;
  const end = $("#fEnd").value;
  const capacity = Number($("#fCapacity").value);
  if(!start){ setEditorNote("Укажите время начала", true); return; }
  if(!Number.isFinite(capacity) || capacity < 1){ setEditorNote("Мест должно быть не меньше 1", true); return; }

  btn.disabled = true;
  setEditorNote("Сохраняем…", false);
  try{
    let saved;
    if(editingId){
      saved = await mutate("/api/club/trips/" + encodeURIComponent(editingId), "PATCH",
        { start, end, capacity });
    }else{
      const spot = $("#fSpot").value;
      const boat = $("#fBoat").value.trim();
      const date = $("#fDate").value;
      if(!spot || !boat || !date) throw new Error("Заполните акваторию, лодку и дату");
      saved = await mutate("/api/club/trips", "POST", { spot, boat, date, start, end, capacity });
    }
    const id = saved.id;
    closeEditor();
    await load();
    await openTrip(id);
  }catch(err){
    setEditorNote(err.message, true);
  }finally{
    btn.disabled = false;
  }
});

$("#editorClose").addEventListener("click", closeEditor);
$("#addTrip").addEventListener("click", () => openEditor(null));

$("#logout").addEventListener("click", async () => {
  await fetch("/api/club/logout", { method:"POST" }).catch(() => {});
  window.location.href = "/club";
});

load();
</script>
</body>
</html>
